name: Publish Fusion container

on:
  push:
    branches:
      - codex/fusion-container-0056
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable container tag to publish
        required: true
        default: v0.76.0-besa-0057

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/besa-franz/fusion
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.76.0-besa-0057' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pinned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify the published manifest
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
